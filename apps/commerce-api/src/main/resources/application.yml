server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 1000  # TCP 연결 수립 대기 (ms)
            readTimeout: 3000     # 응답 대기 (ms) — timelimiter(600ms)가 먼저 끊지만 소켓 정리 보장용

resilience4j:
  circuitbreaker:
    # Feign이 자동 생성하는 CB 이름(PgPaymentClient#requestPayment...)이 instances 키와 달라
    # configs.default로 설정해야 실제 Feign CB에 적용된다
    configs:
      default:
        sliding-window-size: 20
        failure-rate-threshold: 60
        slow-call-duration-threshold: 100ms  # 100ms 초과 응답을 '느린 호출'로 간주
        slow-call-rate-threshold: 50          # 느린 호출이 50% 넘으면 OPEN — 에러 없이 느리기만 해도 CB가 열림
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        timeout-duration: 600ms

queue:
  max-size: 100000 # 대기열 상한 (초과 시 429)
  scheduler:
    enabled: true
    interval-ms: 100 # 실행 주기 — 입장을 시간축으로 분산해 Thundering Herd 완화
    batch-size: 10 # 회당 입장 인원 — 커넥션 풀 40 × 주문 몫 50% × (1000ms / 처리시간 200ms) = 초당 100명 → 100ms당 10명
  token:
    ttl-seconds: 300 # 입장 토큰 TTL 5분 — 주문서 확인 + 결제 수단 선택에 충분한 시간
  entry-token:
    required: true # false 시 토큰 검증 우회 — Redis 장애 대비 kill switch
  jitter:
    max-ms: 500 # 토큰 발급 후 노출/검증까지의 랜덤 지연 상한 — 배치 간격 100ms의 5배로 Thundering Herd 완화, 0이면 비활성

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

pg:
  url: http://localhost:8082
  callback-url: http://localhost:8080/api/v1/payments/callback

---
spring:
  config:
    activate:
      on-profile: test

# [fix] 캐시된 타 테스트 컨텍스트의 백그라운드 스케줄러가 공유 Redis 대기열을 비워 순번 검증이 깨지던 문제
# 테스트에서는 스케줄러를 끄고 admitNextBatch() 수동 호출로 검증한다
queue:
  scheduler:
    enabled: false
  jitter:
    # 기본은 0(즉시 노출)로 두어 기존 통합/E2E 테스트를 그대로 유지, Jitter 검증만 별도 클래스에서 override
    max-ms: 0

